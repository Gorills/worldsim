name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worldsim-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2-stable
  GODOT_LINUX_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4

jobs:
  core:
    name: Core / GCC
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset dev

      - name: Build
        run: cmake --build --preset dev --parallel

      - name: Test
        run: ctest --preset dev

      - name: Run stability matrix smoke
        run: >-
          python3 scripts/run_stability_matrix.py
          --binary ./out/dev/worldsim_long_run
          --years 2
          --seeds 0,42,999
          --levels 2,3
          --modes coupled
          --assert-stable
          --output out/stability-matrix-smoke

      - name: Upload stability matrix smoke
        uses: actions/upload-artifact@v4
        with:
          name: worldsim-stability-matrix-smoke
          path: out/stability-matrix-smoke
          if-no-files-found: error
          retention-days: 14

      - name: Generate C++ visual diagnostics
        run: ./out/dev/worldsim_visual_dump --suite --width 512 --height 256 --output out/visual-dump

      - name: Upload C++ visual diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: worldsim-visual-dump
          path: out/visual-dump
          if-no-files-found: error
          retention-days: 14

      - name: Run geology plausibility benchmark
        run: ./out/dev/worldsim_geology_benchmark --seed-count 64 --samples 4096 --cover-level 5 --output out/geology-benchmark

      - name: Upload geology plausibility benchmark
        uses: actions/upload-artifact@v4
        with:
          name: worldsim-geology-benchmark
          path: out/geology-benchmark
          if-no-files-found: error
          retention-days: 14

  godot-linux:
    name: Godot 4.7 / Linux integration
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Keep correctness validation independent of optional compiler-cache services.
      # The build profile already limits generated godot-cpp wrappers to classes
      # used by this adapter.

      - name: Configure GDExtension
        run: >-
          cmake -S . -B out/godot-ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DWORLDSIM_BUILD_TESTS=OFF
          -DWORLDSIM_BUILD_CLI=OFF
          -DWORLDSIM_BUILD_GODOT=ON
          -DWORLDSIM_FETCH_GODOT_CPP=ON
          -DGODOTCPP_API_VERSION=4.7
          -DGODOTCPP_TARGET=template_debug
          -DWORLDSIM_GODOT_HOT_RELOAD=OFF

      - name: Build GDExtension only
        run: cmake --build out/godot-ci --target worldsim_godot --parallel

      - name: Cache Godot editor
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: .ci/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64-${{ env.GODOT_LINUX_SHA256 }}

      - name: Download pinned Godot editor
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/godot
          curl --fail --location --retry 3 --retry-all-errors \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" \
            --output .ci/godot/godot.zip
          echo "${GODOT_LINUX_SHA256}  .ci/godot/godot.zip" | sha256sum --check --strict
          unzip -q .ci/godot/godot.zip -d .ci/godot
          rm .ci/godot/godot.zip

      - name: Godot headless smoke
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$(find .ci/godot -maxdepth 1 -type f -name 'Godot_v*_linux.x86_64' -print -quit)"
          test -n "$GODOT"
          chmod +x "$GODOT"
          "$GODOT" --headless --version
          # godot-cpp upstream also treats editor --import as best-effort because
          # the headless editor can abort after generating .godot. The actual gate
          # is the runtime smoke script below.
          timeout 30 "$GODOT" --headless --path godot/project --import >/dev/null 2>&1 || true
          timeout 60 "$GODOT" --headless --path godot/project --script res://ci_smoke.gd
          timeout 60 "$GODOT" --headless --path godot/project --script res://ci_resource_acquisition.gd
          # Parse and run the actual viewer scene as well. This covers GDScript,
          # Theme resources, InputMap-backed startup and gettext catalog loading.
          timeout 60 "$GODOT" --headless --path godot/project --language ru --scene res://main.tscn --quit-after 2
          # Mesh winding and world-space AABB: inverted triangles were culled, so
          # the exported scene showed only a noisy horizon line instead of terrain.
          timeout 60 "$GODOT" --headless --path godot/project --script res://ci_terrain_view.gd
          # Survey flight must preserve large logical coordinates, keep the
          # destination tile available, and restore grounded walking safely.
          timeout 60 "$GODOT" --headless --path godot/project --script res://ci_fast_travel.gd
          # The macro viewer must build a runtime elevation texture from the same
          # terrain source used by the simulation, not from a separate map generator.
          timeout 60 "$GODOT" --headless --path godot/project --script res://ci_world_map_view.gd
          # The full-world laboratory must expose live domain fields, time controls,
          # active-cover statistics/history and exact-cell inspection.
          timeout 60 "$GODOT" --headless --path godot/project --script res://ci_simulation_lab.gd

      - name: Install visual capture display dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri

      - name: Capture Godot rendered walk frame
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          WORLDSIM_VISUAL_CAPTURE_DIR: ${{ github.workspace }}/out/godot-visual
        run: |
          set -euo pipefail
          GODOT="$(find .ci/godot -maxdepth 1 -type f -name 'Godot_v*_linux.x86_64' -print -quit)"
          test -n "$GODOT"
          mkdir -p "$WORLDSIM_VISUAL_CAPTURE_DIR"
          timeout 90 xvfb-run -a -s "-screen 0 1600x900x24" \
            "$GODOT" \
            --path godot/project \
            --language ru \
            --windowed \
            --resolution 1600x900 \
            --rendering-method gl_compatibility \
            --script res://ci_visual_capture.gd
          test -s "$WORLDSIM_VISUAL_CAPTURE_DIR/walk_spawn.png"

      - name: Upload Godot visual artifact
        uses: actions/upload-artifact@v4
        with:
          name: worldsim-godot-visual
          path: out/godot-visual
          if-no-files-found: error
          retention-days: 14
