name: Manifest probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  hash:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Print tracked hashes
        run: |
          sha256sum \
            ./docs/ARCHITECTURE.md \
            ./docs/ECOLOGY_VALIDATION.md \
            ./include/worldsim/spatial.hpp \
            ./include/worldsim/state.hpp \
            ./src/modules.cpp \
            ./src/simulation.cpp \
            ./src/spatial.cpp \
            ./src/state.cpp \
            ./tests/fauna_v2_tests.cpp \
            ./tests/worldsim_tests.cpp
